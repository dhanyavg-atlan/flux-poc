# Flux pulls the cosign-signed poc-chart from Artifact Registry by VERSION.
# Auth is GKE Workload Identity (provider: gcp) — no static pull secret.
# verify refuses any chart not signed by the dev KMS key.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: poc-app-chart
  namespace: flux-system         # flux-system: the one ns kustomize-controller reliably has cached
                                 # (cosign-pub-dev public key copied here too)
spec:
  interval: 1m
  provider: gcp
  url: oci://us-central1-docker.pkg.dev/dev-infra-test-497417/shared-artifacts/poc-chart
  ref:
    # semver range, not a pinned tag: Flux auto-selects the HIGHEST matching version.
    # CI pushes monotonic 1.0.<run_number>, so a new release is picked up automatically —
    # no manual bump. (Prod should instead PIN a tag and bump it via a reviewed PR.)
    semver: ">=0.2.0"
  verify:
    provider: cosign
    secretRef:
      name: cosign-pub-dev
